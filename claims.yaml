- id: bertrand-pyramids
  kind: source
  passage: Reciprocity restrains extraction without eliminating it; related-party transactions and group-level
    extraction persist, measured in the propagation of earnings shocks through pyramids [@bertrand2002]
    and addressed incompletely by a decade of minority-protection reform [@oecd2014].
  evidence:
    citation_id: bertrand2002
    locator: Abstract
    verified: true
    verification_note: 'OpenAlex abstract: tunneling measured through the propagation of earnings shocks
      across firms within Indian business groups.'
