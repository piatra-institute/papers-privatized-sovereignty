- id: co-assumptions
  kind: assumption
  passage: An organization has a capability stock of 10 that grows at 0.25 a year under a good controller.
  rationale: Structural constants of the correction model (stock 10, growth 0.25, damage 0.8, visibility
    6, defeat 2) and per-architecture parameters are stated assumptions without empirical estimation.
- id: wedge-def
  kind: definition
  passage: The quantity to track is the wedge, voting share minus economic share.
  rationale: Defines the paper's central measure.
- id: entrenchment-rule
  kind: assumption
  passage: The controller internalizes α of the improvement and all of the private benefit, so control
    is kept whenever the benefit exceeds α times the forgone value.
  rationale: Decision rule of the entrenchment model; the threshold stake follows from it given the stated
    private benefit and forgone value.
- id: five-dimensions
  kind: definition
  passage: Five dimensions organize the comparison.
  rationale: Defines the comparative frame (visibility, reciprocity, mandate, removability, informational
    correction).
- id: self-reinforcing
  kind: interpretation
  passage: 'Entrenchment is therefore self-reinforcing: selling economic exposure strengthens the incentive
    to keep control, and keeping control makes the remaining exposure safer to sell.'
  rationale: 'Follows from the entrenchment rule: a lower stake lowers the retention threshold, so selling
    exposure strengthens the incentive to retain control.'
- id: orderings-robust
  kind: interpretation
  passage: 'Finally, the models are stylized: the lifecycle drag, the defection thresholds and the correction
    rates are structural assumptions without empirical estimation, so the claims concern orderings, crossovers
    and decompositions that survive changes in parameters, with every constant published and every invariant
    tested on each run.'
  rationale: 'States the evidential status of the models: constants are assumptions; claims concern orderings
    and decompositions.'
- id: pathology-locus
  kind: interpretation
  passage: Hierarchy is present in every system, and the pathology arises where hierarchy is protected
    from correction, whether by a share class, a loyalty cadre, a crossholding network or a family pyramid.
  rationale: Comparative conclusion drawn from the five-system discussion and the correction model; not
    a measured quantity.
- id: charter-rules
  kind: normative
  passage: The reform follows the models in 6 rules.
  rationale: Policy proposals derived from the model rankings (renewable sunset first; removability over
    transparency).
- id: spacex-82
  kind: source
  passage: In June 2026 SpaceX priced the largest listing of its era with its founder at 82.4 percent
    of the vote, holding 91.6 percent of a Class B that separately elects 51 percent of the directors,
    with an economic stake of roughly 46 percent that falls with every sale [@spacex2026].
  evidence:
    citation_id: spacex2026
    locator: Form 424B4 (filed June 12, 2026), prospectus summary and 'Description of Capital Stock'
    verified: true
    verification_note: 'Fetched from EDGAR: Musk ''will hold approximately 82.4% of the voting power'';
      his Class B holding ''comprises approximately 91.6% of our Class B common stock''; Class B voting
      separately elects ''51% of the total number of authorized directors''. Economic stake computed from
      the prospectus share counts: (849,494,440 + 5,219,053,075) / (7,380,196,910 + 5,695,668,265) = 46.4%.'
- id: spacex-abstract
  kind: source
  passage: In June 2026 the largest aerospace firm in the world sold shares to the public while its founder
    retained 82.4 percent of the vote through a class of stock that also elects a majority of the board
    [@spacex2026].
  evidence:
    citation_id: spacex2026
    locator: Form 424B4, prospectus summary
    verified: true
    verification_note: 'Fetched from EDGAR: 82.4% of voting power; Class B elects a majority (51%) of
      the board.'
- id: snap-99
