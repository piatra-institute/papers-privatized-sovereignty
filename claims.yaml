- id: race-flat
  kind: interpretation
  passage: With demand held flat the norm survives the century, so the race requires rising demand and
    cannot be explained by exchange behaviour alone.
  rationale: results.json /race/flat_demand_defected = false; the inference that the race requires rising
    demand follows from this counterfactual within the model.
- id: race-tenth
  kind: interpretation
  passage: With the floor kept, domestic wedges stay at zero while about a tenth of demand moves to venues
    outside the coordinated zone, so coordination works imperfectly at a cost that is small relative to
    the cascade it prevents.
  rationale: results.json /race/floor_held/domestic_share_final = 0 and /race/floor_held/leakage_over_demand
    = 0.104; 'about a tenth' is the rounded statement of the latter.
