- id: abs-alpha-star
  kind: computation
  passage: 'In a simple model the wedge finances its own persistence: a controller whose economic stake
    is below 0.42 rationally keeps control that destroys firm value, because the private benefits of control
    exceed the controller''s share of the loss, and the Ford family''s stake of 0.018 lies a factor of
    24 inside that threshold.'
  evidence:
    file: simulation/output/results.json
    run_id: models
    pointer: /lifecycle/entrenchment/alpha_star
    reported: '0.42'
    decimals: 2
    units: threshold economic stake
    conditions: lifecycle model (expected-value arithmetic), population of 3 decay types, 25-year horizon
