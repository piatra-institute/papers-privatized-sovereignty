- id: gompers-masulis
  kind: source
  passage: 'The evidence agrees: as insider voting rights rise above cash-flow rights, firm value falls
    [@gompers2010], cash is worth less to outside shareholders, acquisitions destroy more value and executive
    pay rises [@masulis2009].'
  evidence:
    citation_id: masulis2009
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract: as the divergence widens, cash holdings are worth less to outside
      shareholders, CEOs receive higher compensation and value-destroying acquisitions are more frequent.
      Gompers, Ishii and Metrick (2010) abstract: firm value increasing in insiders'' cash-flow rights
      and decreasing in voting rights.'
- id: laporta-norm
  kind: source
  passage: Ten-vote and twenty-vote classes, the pyramids of East Asia [@claessens2000] and the crossholdings
    of the chaebol are variants of one instrument, and concentrated control is the norm worldwide [@laporta1999].
  evidence:
    citation_id: laporta1999
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract: in 27 wealthy economies relatively few large firms are widely
      held; they are typically controlled by families or the State, with control in excess of cash-flow
      rights via pyramids.'
- id: brodsgaard-nomenklatura
  kind: source
  passage: Party organization inside the large business groups controls appointments and strategy through
    the nomenklatura system [@brodsgaard2012], and the 2023 revision of the Company Law, effective July
    2024, modernized capital rules, audit committees and controlling-shareholder liability within that
    political order [@npc2023].
  evidence:
    citation_id: brodsgaard2012
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract: through the nomenklatura system the Party controls appointment
      of CEOs and presidents of the most important business groups.'
- id: bae-tunneling
  kind: source
  passage: 'Korea concentrated control in families through crossholdings, and the measured cost is tunneling:
    mergers timed and priced to transfer value from minority shareholders to the controlling family [@bae2002].'
  evidence:
    citation_id: bae2002
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract: chaebol acquisitions lower the acquirer''s price while the
      controlling shareholder benefits through other group firms, consistent with tunneling.'
