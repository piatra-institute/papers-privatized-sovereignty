- id: lc-drag
  kind: assumption
  passage: A controller starts with a knowledge advantage worth 0.30 units of annual value flow, which
    decays exponentially; insulation also imposes a constant drag of 0.12, the sum of a 0.05 distortion
    from extraction of private benefits and the 0.07 a firm forgoes by excluding market discipline.
  rationale: Structural constants of the lifecycle model (knowledge advantage 0.30, drag 0.12 = 0.05 extraction
    + 0.07 forgone discipline) set by the authors; only the crossover is calibrated, to the documented
    6-to-9-year window.
